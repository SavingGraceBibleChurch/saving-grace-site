# Points public staging (port 8080) at the static site served by nginx (savinggrace-nginx.service, 127.0.0.1:8084).
# Earlier: the Python server on 127.0.0.1:8083 (backup in /root/savinggrace-backups/static-site.conf.python-8083).
# Remove this file and restart the proxy to go back to the old Codex app.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-socket-proxyd 127.0.0.1:8084
