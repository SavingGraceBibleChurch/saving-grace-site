# Requests the site refuses with 403, checked at the top of savinggrace-site.conf. Maps belong in the http
# block, so production.conf, bootstrap-http.conf and staging-nginx.conf include this file before their servers.
# Carried over from the WordPress server's bot-blocking.conf (Yang, November 2026). What was left out, and
# why, is in deploy/production/README.md ("Rules carried over from the WordPress server").

# Bots refused by user agent: the WordPress server's list, less the AI search bots (OAI-SearchBot, ChatGPT-User,
# PerplexityBot, Applebot), which are allowed with a speed limit below. nginx tries the regular expressions in order
# and uses the first that matches, so the search engines and link previews listed first are never refused.
# This refuses curl too: test the site with a browser user agent (curl -A "Mozilla/5.0" ...).
map $http_user_agent $sg_bad_bot {
  default 0;

  # Search engines and link previews: allowed.
  "~*Googlebot" 0;
  "~*Bingbot" 0;
  "~*Slurp" 0;  # Yahoo
  "~*DuckDuckBot" 0;
  "~*Baiduspider" 0;
  "~*YandexBot" 0;
  "~*facebookexternalhit" 0;  # Facebook, also iMessage previews
  "~*Twitterbot" 0;
  "~*LinkedInBot" 0;
  "~*Slackbot" 0;

  # AI training crawlers. (The AI search bots are allowed, with a speed limit: see the end of this file.)
  "~*GPTBot" 1;
  "~*CCBot" 1;
  "~*ClaudeBot" 1;
  "~*Claude-Web" 1;
  "~*anthropic-ai" 1;
  "~*Bytespider" 1;  # TikTok/ByteDance
  "~*Omgilibot" 1;

  # SEO tool crawlers.
  "~*SemrushBot" 1;
  "~*AhrefsBot" 1;
  "~*MJ12bot" 1;  # Majestic
  "~*BLEXBot" 1;
  "~*DotBot" 1;  # Moz
  "~*Barkrowler" 1;
  "~*SEMrush" 1;
  "~*Screaming Frog" 1;

  # Amazon and other crawlers.
  "~*Amazonbot" 1;
  "~*Amzn-SearchBot" 1;
  "~*PetalBot" 1;
  "~*SERankingBacklinksBot" 1;

  # Scanners and command-line tools.
  "~*python-requests" 1;
  "~*curl" 1;
  "~*wget" 1;
  "~*masscan" 1;
  "~*nmap" 1;
  "~*sqlmap" 1;
  "~*nikto" 1;
  "~*dirb" 1;
  "~*gobuster" 1;
  "~*zgrab" 1;
  "~*nuclei" 1;
  "~*acunetix" 1;
  "~*nessus" 1;

  # Generic scrapers.
  "~*scraper" 1;
  "~*harvest" 1;
  "~*extract" 1;

  # No user agent at all.
  "" 1;
  "~*^$" 1;
}

# AI search bots: allowed, because they are what puts the church into ChatGPT, Perplexity and Siri/Spotlight
# answers, but each bot as a whole (all its addresses together) is held to 5 requests a second, with bursts of
# up to 30; past that it gets 429 "too many requests" and slows down. Agreed with Yang, November 2026. Everyone
# else has an empty key here, which nginx does not count. To block one of these again, move it to $sg_bad_bot.
map $http_user_agent $sg_ai_search_bot {
  default "";
  "~*Googlebot" "";  # never limited, whatever else its user agent says
  "~*OAI-SearchBot" "openai-search";
  "~*ChatGPT-User" "openai-user";
  "~*PerplexityBot" "perplexity";
  "~*Perplexity-User" "perplexity-user";
  "~*Applebot" "apple";
}
limit_req_zone $sg_ai_search_bot zone=sg_ai_search:1m rate=5r/s;

# Requests looking for WordPress, PHP or server files, or carrying attack strings. None of these exist on the
# static site. Same list as the WordPress server, less two patterns that match this site's own addresses:
# "https?:/(?!/)" would refuse the /https:/… redirect for malformed self-links that Search Console reported,
# and "union.*select" could refuse a sermon whose address has "union" then "select" in it (there is no
# database, so it protected nothing here).
map $request_uri $sg_bad_request {
  default 0;

  # Sensitive files.
  "~*\.env" 1;
  "~*wp-config\.php" 1;
  "~*\.git/" 1;
  "~*\.svn/" 1;

  # PHP vulnerability scanning.
  "~*eval-stdin" 1;
  "~*phpunit" 1;
  "~*/vendor/phpunit" 1;
  "~*xmlrpc\.php" 1;
  "~*tel:" 1;

  # Common attack patterns.
  "~*concat.*\(" 1;
  "~*<script" 1;
  "~*javascript:" 1;
  "~*\.\./" 1;
  "~*\.\.\\\\" 1;
  "~*base64_decode" 1;
  "~*eval\(" 1;
}
