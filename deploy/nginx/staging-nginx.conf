# Staging: a separate nginx instance (/etc/nginx/savinggrace-staging.conf, run by savinggrace-nginx.service)
# on 127.0.0.1:8084 only. The public port 8080 proxy forwards to it. It serves exactly what production
# serves, with the same rules and redirects, plus a noindex header and no HTTPS.
user nginx;
worker_processes 1;
pid /run/savinggrace-nginx.pid;
error_log /var/log/nginx/savinggrace-staging-error.log warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  access_log /var/log/nginx/savinggrace-staging-access.log;

  include /srv/savinggrace-static/nginx/redirect-maps.conf;

  server {
    listen 127.0.0.1:8084;
    server_name _;
    root /srv/savinggrace-static/current;
    set $sg_hsts "";
    set $sg_robots "noindex, nofollow";
    include /etc/nginx/snippets/savinggrace-site.conf;
  }
}
