# Temporary: serves the site over plain HTTP so Let's Encrypt can issue the first certificate after the
# DNS points here. Replace it with production.conf as soon as the certificate exists (deploy/production/README.md).
include /srv/savinggrace-static/nginx/redirect-maps.conf;

server {
  listen 80;
  listen [::]:80;
  server_name savinggrace.org.au www.savinggrace.org.au;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  root /srv/savinggrace-static/current;
  set $sg_hsts "";
  set $sg_robots "";
  include /etc/nginx/snippets/savinggrace-site.conf;
}
