# Security headers for every response. Included at server level and again inside each location that sets
# its own headers, because nginx drops server-level add_header lines in any location that has its own.
# $sg_hsts and $sg_robots are set by the server block: empty values send no header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Scripts, styles, fonts and data come only from this site. Inline scripts and styles are part of the
# built pages; WebAssembly is site search (Pagefind). Videos and audio play in YouTube and SermonAudio frames.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://embed.sermonaudio.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security $sg_hsts always;
add_header X-Robots-Tag $sg_robots always;
