# Production: /etc/nginx/conf.d/savinggrace.conf, run by the system nginx (nginx 1.25.1 or newer, for "http2 on";
# Amazon Linux 2023 has 1.30). Needs: the snippets in /etc/nginx/snippets/, the certificate in /etc/nginx/ssl/
# (savinggrace-fullchain.crt: the certificate followed by its intermediate chain; savinggrace.key: readable by
# root only), and the updater, which writes /srv/savinggrace-static/current and nginx/redirect-maps.conf.
# See deploy/production/README.md.

include /srv/savinggrace-static/nginx/redirect-maps.conf;
include /etc/nginx/snippets/savinggrace-blocking-maps.conf;

# Port 80: certificate checks, otherwise straight to https://www.
server {
  listen 80;
  listen [::]:80;
  server_name savinggrace.org.au www.savinggrace.org.au;
  server_tokens off;
  # Sectigo's file-based domain check when the certificate is renewed.
  location ^~ /.well-known/pki-validation/ {
    root /var/www/ssl-validation;
  }
  # Let's Encrypt, if the site ever moves to it.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://www.savinggrace.org.au$request_uri;
  }
}

# https://savinggrace.org.au → https://www.savinggrace.org.au (the canonical host).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name savinggrace.org.au;
  server_tokens off;
  ssl_certificate /etc/nginx/ssl/savinggrace-fullchain.crt;
  ssl_certificate_key /etc/nginx/ssl/savinggrace.key;
  include /etc/nginx/snippets/savinggrace-tls.conf;
  return 301 https://www.savinggrace.org.au$request_uri;
}

# The site.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.savinggrace.org.au;
  ssl_certificate /etc/nginx/ssl/savinggrace-fullchain.crt;
  ssl_certificate_key /etc/nginx/ssl/savinggrace.key;
  include /etc/nginx/snippets/savinggrace-tls.conf;

  root /srv/savinggrace-static/current;
  # Browsers keep to HTTPS for a year (subdomains are left alone).
  set $sg_hsts "max-age=31536000";
  set $sg_robots "";
  access_log /var/log/nginx/savinggrace-access.log;
  error_log /var/log/nginx/savinggrace-error.log warn;
  include /etc/nginx/snippets/savinggrace-site.conf;
}

# Requests for the bare IP address or any other name are dropped. (Its name is "" rather than "_" so it does not
# clash with the example server in Amazon Linux's stock nginx.conf; default_server is what makes it the catch-all.)
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name "";
  ssl_reject_handshake on;
  return 444;
}
