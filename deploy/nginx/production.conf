# Production: /etc/nginx/conf.d/savinggrace.conf on the live server.
# Needs: the snippets in /etc/nginx/snippets/, the Let's Encrypt certificate for both names, and the
# updater (which writes /srv/savinggrace-static/current and nginx/redirect-maps.conf). See deploy/production/README.md.

include /srv/savinggrace-static/nginx/redirect-maps.conf;

# Port 80: Let's Encrypt renewals, otherwise straight to https://www.
server {
  listen 80;
  listen [::]:80;
  server_name savinggrace.org.au www.savinggrace.org.au;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://www.savinggrace.org.au$request_uri;
  }
}

# https://savinggrace.org.au → https://www.savinggrace.org.au (the canonical host).
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name savinggrace.org.au;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/www.savinggrace.org.au/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.savinggrace.org.au/privkey.pem;
  include /etc/nginx/snippets/savinggrace-tls.conf;
  return 301 https://www.savinggrace.org.au$request_uri;
}

# The site.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.savinggrace.org.au;
  ssl_certificate /etc/letsencrypt/live/www.savinggrace.org.au/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.savinggrace.org.au/privkey.pem;
  include /etc/nginx/snippets/savinggrace-tls.conf;

  root /srv/savinggrace-static/current;
  # Browsers keep to HTTPS for a year (subdomains are left alone).
  set $sg_hsts "max-age=31536000";
  set $sg_robots "";
  access_log /var/log/nginx/savinggrace-access.log;
  error_log /var/log/nginx/savinggrace-error.log warn;
  include /etc/nginx/snippets/savinggrace-site.conf;
}

# Requests for the bare IP address or any other name are dropped.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
  return 444;
}
