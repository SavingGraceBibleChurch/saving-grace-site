# How the Saving Grace site is served: included in the server block of production and staging, after
# `root` and the $sg_hsts / $sg_robots variables are set. The redirect maps it uses are generated with every
# build (scripts/nginx-redirects.mjs) and installed by the updater as /srv/savinggrace-static/nginx/redirect-maps.conf;
# the blocking maps are /etc/nginx/snippets/savinggrace-blocking-maps.conf. Both must be included in the http block.
# The order of checks mirrors resolve() in scripts/verify-seo.mjs, the SEO check's model of the host.

index index.html;
charset utf-8;
server_tokens off;
# Redirects say "/new/address/" rather than a full URL, so they also work behind the staging proxy.
absolute_redirect off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml text/plain text/calendar application/wasm;

include /etc/nginx/snippets/savinggrace-headers.conf;

# 0. Refused (403): blocked bots and probes for WordPress or server files (savinggrace-blocking-maps.conf),
#    before anything else; and blocked addresses (savinggrace-ip-deny.conf), on every page they ask for (nginx
#    checks addresses after the redirects, so an old link from one still gets its 301 first).
if ($sg_bad_bot) {
  return 403;
}
if ($sg_bad_request) {
  return 403;
}
include /etc/nginx/snippets/savinggrace-ip-deny.conf;
# The AI search bots' speed limit ($sg_ai_search_bot in savinggrace-blocking-maps.conf); nobody else is counted.
limit_req zone=sg_ai_search burst=30 nodelay;
limit_req_status 429;
limit_req_log_level warn;

# 1. Old WordPress links with a query string (/sermons/?sermon_speaker=…) and WordPress search (/?s=…).
if ($sg_query_redirect) {
  return 301 $sg_query_redirect;
}

# The RSS feeds keep their WordPress addresses and are served, not redirected.
location = /sermons/feed/ {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=600" always;
  types { }
  default_type "application/rss+xml; charset=utf-8";
  try_files /sermons/feed/index.xml =404;
}
location = /feed/ {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=600" always;
  types { }
  default_type "application/rss+xml; charset=utf-8";
  try_files /feed/index.xml =404;
}
location = /events/calendar.ics {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=3600" always;
  types { }
  default_type "text/calendar; charset=utf-8";
}

# Build-time files are never served.
location ^~ /_nginx/ {
  return 404;
}

# Files with a content hash in their name never change: cache them for a year.
location ^~ /_astro/ {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}
location ^~ /pagefind/ {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}
# Old WordPress uploads (sermon MP3s, images, PDFs) are too big for Git, so they live in a permanent folder
# outside the builds, uploaded once (deploy/upload-old-files.sh). Anything not there is looked for in the build.
location ^~ /wp-content/uploads/ {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=604800" always;
  root /srv/savinggrace-static/uploads;
  try_files $uri @build_file;
}
location @build_file {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=604800" always;
  root /srv/savinggrace-static/current;
  try_files $uri @missing;
}
location ~ ^/(media|brand|wp-content)/ {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "public, max-age=604800" always;
  try_files $uri @missing;
}

# 2. Pages: the file itself, or the page's index.html. Anything else goes to @missing.
location / {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri ${uri}index.html @missing;
}

# 3. A page that moved, 4. a page that needs its trailing slash, 5. anything under an old address, else 404.
location @missing {
  include /etc/nginx/snippets/savinggrace-headers.conf;
  if ($sg_exact_redirect) {
    return 301 $sg_exact_redirect;
  }
  if (-f $document_root${uri}/index.html) {
    return 301 $uri/$is_args$args;
  }
  if ($sg_prefix_redirect = $uri) {
    return 404;
  }
  if ($sg_prefix_redirect) {
    return 301 $sg_prefix_redirect;
  }
  return 404;
}

error_page 404 /404.html;
location = /404.html {
  internal;
  include /etc/nginx/snippets/savinggrace-headers.conf;
  add_header Cache-Control "no-cache" always;
}
