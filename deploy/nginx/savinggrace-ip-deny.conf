# Addresses refused with 403 everywhere on the site; included in the server block by savinggrace-site.conf.
# From the WordPress server (Yang, November 2026): the eight addresses in its nginx.conf, and the 155 ranges in
# ip-blocking.conf (185.220.101.0/24 to 185.220.255.0/24), written here as five larger ranges that cover
# exactly the same addresses. Add a "deny <address or range>;" line to block another one.
# Only production can apply these: on staging every request reaches nginx from 127.0.0.1 through the port 8080
# proxy. (The WordPress list also had "allow" lines for 127.0.0.1 and private networks; with no "deny all"
# after them they did nothing, so they are left out.)

deny 20.171.207.11;
deny 20.171.207.249;
deny 144.76.32.145;
deny 85.208.96.209;
deny 85.208.96.197;
deny 85.208.96.211;
deny 185.191.171.15;
deny 185.191.171.13;

deny 185.220.101.0/24;
deny 185.220.102.0/23;  # 185.220.102.x to 185.220.103.x
deny 185.220.104.0/21;  # 185.220.104.x to 185.220.111.x
deny 185.220.112.0/20;  # 185.220.112.x to 185.220.127.x
deny 185.220.128.0/17;  # 185.220.128.x to 185.220.255.x
