# Builds the admin and publishes it to GitHub Pages (HTTPS). It holds no data or secrets:
# each editor signs in with their own GitHub token, and saves go straight to main through the GitHub API.
name: Admin

on:
  push:
    branches: [main]
    paths: ["admin/**", "scripts/lib/**", ".github/workflows/admin.yml", "package.json", "package-lock.json"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run admin:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
